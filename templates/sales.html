{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">Record a Sale</h2>
<div class="card p-4 shadow-sm border-0 mb-5">
    <form method="POST">
        <div class="row">
            <div class="col-md-5 mb-3">
                <label class="form-label text-muted">Product</label>
                <select name="product_id" class="form-select" required>
                    {% for p in products %}
                    <option value="{{ p.id }}">{{ p.name }} - ${{ "%.2f"|format(p.price) }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label text-muted">Quantity</label>
                <input type="number" name="quantity" class="form-control" min="1" value="1" required>
            </div>
            <div class="col-md-4 d-flex align-items-end mb-3">
                <button type="submit" class="btn btn-primary w-100">Submit Sale</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
