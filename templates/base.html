<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coffee Shop Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { height: 100vh; background-color: #2c1e16; padding-top: 20px; }
        .sidebar h4 { color: #d4a373; margin-bottom: 30px; text-align: center; font-weight: bold; }
        .sidebar a { color: #faedcd; text-decoration: none; display: block; padding: 12px 20px; font-size: 1.1rem; }
        .sidebar a:hover { background-color: #d4a373; color: #2c1e16; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Setup -->
            <nav class="col-md-2 sidebar position-fixed">
                <h4>Coffee Admin</h4>
                <a href="/">Dashboard</a>
                <a href="/sales">Sales Form</a>
                <a href="/products">Products Catalog</a>
                <a href="/expenses">Expenses</a>
            </nav>
            <!-- Main Content Area -->
            <main class="col-md-10 offset-md-2 p-5 bg-light" style="min-height: 100vh;">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
