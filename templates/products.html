{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Products Catalog</h2>
    <a href="{{ url_for('add_product') }}" class="btn btn-success">Add New Product</a>
</div>
<table class="table bg-white shadow-sm border-0">
    <thead class="table-dark">
        <tr>
            <th>Product ID</th>
            <th>Name</th>
            <th>Price</th>
            <th class="text-end">Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for p in products %}
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.name }}</td>
            <td>${{ "%.2f"|format(p.price) }}</td>
            <td class="text-end">
                <a href="{{ url_for('edit_product', id=p.id) }}" class="btn btn-sm btn-warning">Edit</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
