name: Docker CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Download your code into the GitHub runner
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Attempt to build the Docker image
    - name: Build Docker Image
      run: docker build -t coffee-shop-app .